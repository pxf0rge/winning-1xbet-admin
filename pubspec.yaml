name: w1xbet_admin
description: "Winning 1xbet Admin Panel"

publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  dio: ^5.9.1
  equatable: ^2.0.8
  get_it: ^9.2.0
  supabase_flutter: ^2.12.0
  shared_preferences: ^2.5.4
  package_info_plus: ^8.3.0
  flutter_localizations:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#0B1B3A"
  adaptive_icon_foreground: assets/icon/app_icon.png
  min_sdk_android: 21

flutter:
  uses-material-design: true
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/Fonts/Vazirmatn-FD-Regular.ttf
